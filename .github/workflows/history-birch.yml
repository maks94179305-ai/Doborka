name: history-birch
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply white birch and archive folders
        run: |
          set -e
          git config user.name "maks94179305-ai"
          git config user.email "maks94179305@gmail.com"
          python3 scripts/apply-min-history.py
          python3 scripts/apply-arch-compact.py
          git add src/lib/types.ts src/lib/store.ts src/components/plan-view.tsx src/components/archive-view.tsx
          git status
          git commit -m "White birch palette; archive cutting/scheme folders with BarScheme" || echo nochange
          git push
