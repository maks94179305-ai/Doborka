name: restore-plan
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "restore"
          git config user.email "restore@users.noreply.github.com"
          git checkout fa85c16d7d481078121de265a7228d4030177c8e -- src/components/plan-view.tsx
          git add src/components/plan-view.tsx
          git commit -m "Restore plan-view.tsx from fa85c16" || echo no change
          git push
