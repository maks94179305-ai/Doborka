name: fix-ui-speed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Snapshot-style cards, thickness still updates numbers/lines
        run: |
          set -e
          git config user.name "fix"
          git config user.email "fix@users.noreply.github.com"
          python3 scripts/restore-live-preview.py
          git add src/components/openings-view.tsx
          git status
          git commit -m "Slope cards: DrawingShot snapshots that update numbers/lines on thickness change" || echo nochange
          git push
