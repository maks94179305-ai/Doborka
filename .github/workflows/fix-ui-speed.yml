name: fix-ui-speed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore live slope card previews
        run: |
          set -e
          git config user.name "fix"
          git config user.email "fix@users.noreply.github.com"
          git show 4f625461b02d58f4c3c90f8bb28fc30075f1947a:src/components/openings-view.tsx > src/components/openings-view.tsx
          python3 scripts/restore-live-preview.py
          git add src/components/openings-view.tsx
          git status
          git commit -m "Restore live slope card previews so thickness numbers update dynamically" || echo nochange
          git push
