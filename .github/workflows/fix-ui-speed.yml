name: fix-ui-speed
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: |
          git config user.name "fix"
          git config user.email "fix@users.noreply.github.com"
          python3 scripts/apply-snapshot-fix.py
          git add src/components/openings-view.tsx src/components/archive-view.tsx
          git status
          git commit -m "Cards show drawing snapshots; history select/share only inside folder" || echo nochange
          git push
