name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build web app
        run: |
          npm install
          npx vite build
          if [ -d .vercel/output/static ]; then WEBDIR=.vercel/output/static
          elif [ -d dist/client ]; then WEBDIR=dist/client
          elif [ -d dist ]; then WEBDIR=dist
          elif [ -d .output/public ]; then WEBDIR=.output/public
          else echo "no web output" && exit 1
          fi
          echo "$WEBDIR" > /tmp/webdir
          if [ ! -f "$WEBDIR/index.html" ]; then
            JS=$(find "$WEBDIR" -name 'index-*.js' | head -1)
            CSS=$(find "$WEBDIR" -name '*.css' | head -1)
            JSREL=${JS#$WEBDIR/}
            CSSREL=${CSS#$WEBDIR/}
            {
              echo '<!doctype html>'
              echo '<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Доборка</title>'
              if [ -n "$CSS" ]; then echo "<link rel=\"stylesheet\" href=\"/$CSSREL\">"; fi
              echo '</head><body><div id="root"></div>'
              if [ -n "$JS" ]; then echo "<script type=\"module\" src=\"/$JSREL\"></script>"; fi
              echo '</body></html>'
            } > "$WEBDIR/index.html"
          fi
          echo "web dir: $WEBDIR"
          ls -la "$WEBDIR" | head
      - name: Add Android shell
        run: |
          WEBDIR=$(cat /tmp/webdir)
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Doborka" com.example.doborka --web-dir "$WEBDIR"
          npx cap add android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: doborka-apk
          path: android/app/build/outputs/apk/debug/*.apk
