name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build phone client
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/share @capacitor/filesystem pillow || pip install pillow
          python3 -m pip install pillow
          python3 scripts/make-icons.py
          node scripts/embed-textures.mjs
          npx vite build --config vite.apk.config.ts
          rm -rf dist-apk-web
          mkdir -p dist-apk-web
          cp dist-apk/apk/index.html dist-apk-web/index.html
          cp -a dist-apk/assets dist-apk-web/assets
          sed -i 's|\.\./assets|assets|g' dist-apk-web/index.html
          cp -a public/. dist-apk-web/ || true
          echo dist-apk-web > /tmp/webdir
      - name: Add Android shell
        run: |
          WEBDIR=$(cat /tmp/webdir)
          npx cap init Doborka com.example.doborka --web-dir "$WEBDIR"
          npx cap add android
          python3 scripts/make-icons.py
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: doborka-apk
          path: android/app/build/outputs/apk/debug/*.apk
