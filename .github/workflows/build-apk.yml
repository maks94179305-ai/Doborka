name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build phone client
        run: |
          npm install
          npx vite build --config vite.apk.config.ts
          cp -a public/. dist-apk/ || true
          test -f dist-apk/index.html
          echo dist-apk > /tmp/webdir
      - name: Add Android shell
        run: |
          WEBDIR=$(cat /tmp/webdir)
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Doborka" com.example.doborka --web-dir "$WEBDIR"
          npx cap add android
          npx cap copy android
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: doborka-apk
          path: android/app/build/outputs/apk/debug/*.apk
