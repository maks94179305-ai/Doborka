name: add-draw-tools
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply draw tools
        run: |
          set -e
          git config user.name "fix"
          git config user.email "fix@users.noreply.github.com"
          git show e6fa7bbe378b27ec50034ac1ee5f9b33c3bd13a0:src/lib/types.ts > src/lib/types.ts
          git show e6fa7bbe378b27ec50034ac1ee5f9b33c3bd13a0:src/lib/draw-render.ts > src/lib/draw-render.ts
          git show e6fa7bbe378b27ec50034ac1ee5f9b33c3bd13a0:src/components/drawing-editor.tsx > src/components/drawing-editor.tsx
          python3 scripts/apply-draw-tools.py
          git add src/lib/types.ts src/lib/draw-render.ts src/components/drawing-editor.tsx
          git commit -m "Drawing editor: freehand, arrow+text, finger tool menu" || echo nochange
          git push
