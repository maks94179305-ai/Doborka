name: birch2-cut
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          set -e
          git config user.name "maks94179305-ai"
          git config user.email "maks94179305@gmail.com"
          python3 scripts/apply-birch2-cut.py
          git add src/components/plan-view.tsx src/lib/share-image.ts
          git commit -m "Double birch stripe; cutting image like in-app BarScheme" || echo nochange
          git push
