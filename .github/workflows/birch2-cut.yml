    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live cutting DOM capture
        run: |
          set -e
          git config user.name "maks94179305-ai"
          git config user.email "maks94179305@gmail.com"
          python3 scripts/apply-live-cut-shot.py
          git add package.json src/lib/share-image.ts src/components/plan-view.tsx
