name: birch2-cut
"on":
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mobile-readable cutting shots
        run: |
          set -e
          git config user.name "maks94179305-ai"
          git config user.email "maks94179305@gmail.com"
          python3 scripts/apply-mobile-cut-shot.py
          git add src/lib/share-image.ts
          git commit -m "Cutting screenshots: larger type and spacing for phone" || echo nochange
          git push
