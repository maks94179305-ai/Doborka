jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply double stripe and cutting shot
        run: |
          set -e
          git config user.name "maks94179305-ai"
          git config user.email "maks94179305@gmail.com"
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/components/plan-view.tsx")
          s = p.read_text()
          old = '''        {profileId(hex) === "white-birch" ? (
          <>
            <path d="M0 20 Q16 8 32 22 L32 28 Q16 14 0 26 Z" fill="#9b9b9b" opacity="0.55" />
