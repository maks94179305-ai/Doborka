name: birch2-cut
"on":
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply extras birch + cutting scheme
        run: |
          set -e
          git config user.name "maks94179305-ai"
          git config user.email "maks94179305@gmail.com"
          python3 scripts/apply-extras-cut-scheme.py
          git add src/components/extras-view.tsx src/components/plan-view.tsx src/lib/share-image.ts
          git commit -m "Extras birch stripes; cutting share shows scheme" || echo nochange
          git push
